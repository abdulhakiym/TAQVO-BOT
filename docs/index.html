<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#08090D">
<title>TAQVO PRO MAX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- BOSH SAHIFA -->
  <main id="home" class="view active">
    <header class="top">
      <div class="brand">
        <div class="logo">☪</div>
        <div>
          <div class="brand-name">TAQVO <span>PRO MAX</span></div>
          <div class="greeting" id="greeting">Assalomu alaykum</div>
        </div>
      </div>
      <div class="dates">
        <div id="dateG">—</div>
        <div id="dateH" class="muted">—</div>
      </div>
    </header>

    <section class="prayer-card glass" id="prayerCard">
      <div class="pc-head">
        <button class="city-btn" id="cityBtn">📍 <span id="cityName">Toshkent</span> ▾</button>
        <div class="muted small" id="methodName"></div>
      </div>
      <div class="next" id="nextBox">
        <div class="muted small">Keyingi namoz</div>
        <div class="next-name" id="nextName">—</div>
        <div class="countdown" id="countdown">--:--:--</div>
      </div>
      <div class="times" id="timesGrid"></div>
      <div class="state" id="prayerState"></div>
    </section>

    <section class="grid" id="sectionGrid"></section>
    <footer class="foot muted small">TAQVO PRO MAX · <a href="https://t.me/hakiymqalb">@hakiymqalb</a></footer>
  </main>

  <!-- ICHKI SAHIFA -->
  <section id="page" class="view">
    <div class="page-bar">
      <button id="backBtn" class="back">‹</button>
      <h2 id="pageTitle"></h2>
    </div>
    <div id="pageBody" class="page-body"></div>
  </section>

  <!-- SHAHAR TANLASH -->
  <div id="citySheet" class="sheet">
    <div class="sheet-box glass">
      <h3>Shaharni tanlang</h3>
      <input id="cityFilter" type="search" placeholder="Qidirish…" autocomplete="off">
      <div id="cityList" class="city-list"></div>
      <button id="gpsBtn" class="btn ghost">🎯 Joylashuvim bo'yicha (GPS)</button>
      <button id="cityClose" class="btn">Yopish</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>
</div>

  <script src="js/api.js"></script>
<script src="js/prayer.js"></script>
<script src="js/quran.js"></script>
<script src="js/tasbeeh.js"></script>
<script src="js/adhkar.js"></script>
<script src="js/quiz.js"></script>
<script src="js/names.js"></script>
<script src="js/app.js"></script>
</body>
</html>
