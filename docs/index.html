<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>TAQVO PRO MAX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">

  <section id="home" class="page active">
    <header class="top">
      <div>
        <p class="hello" id="hello">Assalomu alaykum</p>
        <h1 class="brand">TAQVO <span>PRO MAX</span></h1>
      </div>
      <button class="city-btn" id="cityBtn" aria-label="Shaharni tanlash">
        <span id="cityName">Toshkent</span>
      </button>
    </header>

    <div class="hero" id="hero">
      <svg class="star" viewBox="0 0 100 100" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width=".6">
          <rect x="20" y="20" width="60" height="60"/>
          <rect x="20" y="20" width="60" height="60" transform="rotate(45 50 50)"/>
          <circle cx="50" cy="50" r="30"/><circle cx="50" cy="50" r="14"/>
        </g>
      </svg>
      <p class="hero-label">Keyingi namoz</p>
      <p class="hero-prayer" id="nextName">…</p>
      <p class="hero-time" id="countdown">--:--:--</p>
      <p class="hero-at" id="nextAt"></p>
    </div>

    <div class="prayers" id="prayers" aria-live="polite"></div>
    <p class="note" id="prayerNote"></p>

    <div class="zikr-row">
      <button class="zikr" data-open="morning">Tonggi zikr</button>
      <button class="zikr" data-open="evening">Kechki zikr</button>
    </div>

    <h2 class="h2">Bo‘limlar</h2>
    <div class="grid" id="grid"></div>

    <p class="foot">@hakiymqalb</p>
  </section>

  <section id="view" class="page">
    <button class="back" id="backBtn">Orqaga</button>
    <h2 class="view-title" id="viewTitle"></h2>
    <div class="status" id="viewStatus"></div>
    <div id="viewBody"></div>
  </section>

</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head">
      <h3>Shaharni tanlang</h3>
      <button class="x" id="sheetClose" aria-label="Yopish">✕</button>
    </div>
    <input type="search" id="citySearch" placeholder="Shahar qidirish" autocomplete="off">
    <ul id="cityList"></ul>
  </div>
</div>

<script src="js/zikr-data.js"></script>
<script src="js/zikr.js"></script>
<script src="js/quran.js"></script>
<script src="js/tasbeh.js"></script>
<script src="js/library.js"></script>
<script src="js/knowledge.js"></script>
<script src="js/app.js"></script>
</body>
</html>
