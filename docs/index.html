 box.innerHTML=`<div class="card" style="text-align:center"><div class="sub">Keyingi namoz: ${Lx[ni][0]}</div><div style="font-size:38px;font-weight:800;color:#fff4cf">${p(left/60|0)}:${p(left%60|0)}:${p((left*60)%60|0)}</div></div>`+Lx.map((l,i)=>`<div class="pt ${i==ni?'nx':''}"><span>${l[2]} ${l[0]}</span><b>${tm[l[1]].slice(0,5)}</b></div>`).join('')+`<div class="sub">Hisob: MWL usuli, Hanafiy asr. Mahalliy masjid jadvalidan 1–2 daqiqa farq bo'lishi mumkin.</div>`;loc(box)};dr();tmr=setInterval(dr,1000)}catch(e){box.innerHTML=`<div class="card">Vaqtlar yuklanmadi. Internetni tekshiring.</div>`;loc(box)}}
/* ===== O'YIN (50 savol, har safar tasodifiy) ===== */
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};let G;
P.game=()=>{G={q:sh(QZ).slice(0,50),i:0,s:0,ok:0};$('#app').innerHTML=`<div class="card" style="text-align:center;padding:26px"><div style="font-size:46px">🎮</div><h2>Siyrat o'yini</h2><p class="sub">Bir o'yinda ${G.q.length} ta savol. To'g'ri javob +10 ball. Savollar har safar aralashadi.<br>Eng yaxshi natija: ${S.g('best',0)}</p><button class="b2 gold" onclick="nq()">Boshlash</button></div>`};
function nq(){if(G.i>=G.q.length)return eg();const q=G.q[G.i],o=sh(q.slice(1));$('#app').innerHTML=`<div class="sub">Savol ${G.i+1}/${G.q.length} · Ball: ${G.s}</div><div class="bar"><i style="width:${G.i/G.q.length*100}%"></i></div><div class="card"><h3 style="line-height:1.4">${q[0]}</h3>${o.map(x=>`<button class="opt" onclick="an(this,${x==q[1]})">${x}</button>`).join('')}</div><div id="nx"></div>`;loc($('#app'))}
function an(b,ok){if(document.querySelector('.opt.ok,.opt.bad'))return;const q=G.q[G.i];document.querySelectorAll('.opt').forEach(o=>{if(o.textContent==q[1]||o.textContent==cyr(q[1]))o.classList.add('ok')});if(ok){G.s+=10;G.ok++;hap('medium')}else{b.classList.add('bad');hap('heavy')}G.i++;$('#nx').innerHTML=`<button class="b2 gold" style="width:100%" onclick="nq()">${G.i>=G.q.length?'Natijani ko\'rish':'Keyingisi ›'}</button>`;loc($('#nx'))}
function eg(){S.s('best',Math.max(S.g('best',0),G.s));S.s('games',S.g('games',0)+1);pts(G.s);$('#app').innerHTML=`<div class="card" style="text-align:center;padding:26px"><div style="font-size:46px">${G.ok/G.q.length>.8?'🏆':G.ok/G.q.length>.5?'👏':'📚'}</div><h2>${G.ok} / ${G.q.length} to'g'ri</h2><p class="sub">+${G.s} ball qo'shildi</p><div class="row2"><button class="b2 gold" onclick="go('game')">Qayta o'ynash</button><button class="b2" onclick="go('top')">Reyting</button></div></div>`;loc($('#app'))}
/* ===== REYTING ===== */
P.top=async()=>{const p=S.g('pts',0),dys=S.g('last',0)?Math.floor((Date.now()-S.g('last',0))/864e5):0;
 let h=`<div class="card" style="text-align:center"><div class="sub">Sizning ballingiz</div><div style="font-size:42px;font-weight:800;color:#fff4cf">${p}</div><div class="sub">Tasbeh: ${S.g('tt',0)} · O'yinlar: ${S.g('games',0)} · Eng yaxshi: ${S.g('best',0)}<br>Faol bo'lmasangiz, har kun ball kamayadi.</div></div>`;
 if(!CFG.API){$('#app').innerHTML=h+`<div class="card sub">Umumiy reyting uchun server (Worker) ulanishi kerak. Pastdagi 2-fayl va CFG.API ga qarang.</div>`;loc($('#app'));return}
 $('#app').innerHTML=h+`<div class="sub">Yuklanmoqda...</div>`;loc($('#app'));
 try{const r=await api('/top',{});if(cur!='top')return;h+=`<div class="sub">Bugun faol: <b>${r.active||0}</b> · Jami foydalanuvchi: <b>${r.total||0}</b></div>`+(r.list||[]).map((u,i)=>`<div class="us"><b>${i+1}</b>${u.ph?`<img src="${u.ph}" alt="">`:`<em>${(u.n||'?')[0]}</em>`}<div class="nc">${u.n||'Foydalanuvchi'}${u.u?` · <a style="color:#bfe8d6" href="https://t.me/${u.u}" target="_blank">@${u.u}</a>`:''}<small>${u.ago==0?'bugun faol':u.ago+' kun oldin'}</small></div><b>${u.s}</b></div>`).join('');$('#app').innerHTML=h}catch(e){$('#app').innerHTML=h+`<div class="card">Reyting yuklanmadi.</div>`}loc($('#app'))};
/* ===== KIRISH / OBUNA TEKSHIRUVI ===== */
function gate(t){$('#bk').style.display='none';$('#app').innerHTML=`<div class="card" style="text-align:center;padding:28px"><div style="font-size:46px">🔒</div><h2>${t=='sub'?'Avval kanalga obuna bo\'ling':t=='tg'?'Telegram ichida oching':'Ulanishda xatolik'}</h2><p class="sub" style="margin:10px 0 16px">Ilova faqat @${CFG.CH} kanali obunachilari uchun ishlaydi.</p><div class="lk"><a class="nc" href="https://t.me/${CFG.CH}" target="_blank">Kanalga o'tish</a></div><button class="b2 gold" style="width:100%;margin-top:12px" onclick="boot()">✓ Obuna bo'ldim, tekshirish</button></div>`;loc($('#app'))}
async function boot(){nav();if(CFG.API){if(!(tg&&tg.initData))return gate('tg');try{const r=await api('/check',{});if(!r.ok)return gate('sub')}catch(e){return gate('net')}}go('home')}
boot();
</script>
