
services:
  - type: worker
    name: taqvo-pro-max-bot
    runtime: python
    rootDir: bot
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: CHANNEL_USERNAME
        value: "@hakiymqalb"

      - key: CHANNEL_URL
        value: "https://t.me/hakiymqalb"

      - key: SITE_URL
        value: "https://abdulhakiym.github.io/TAQVO-BOT/"

      - key: DATABASE_PATH
        value: "data/taqvo.sqlite3"

      - key: DEFAULT_CITY
        value: "Karaganda"

      - key: DEFAULT_COUNTRY
        value: "Kazakhstan"

      - key: PRAYER_METHOD
        value: "3"

      - key: TIMEZONE
        value: "Asia/Almaty"

      - key: PORT
        value: "10000"

      - key: LOG_LEVEL
        value: "INFO"

      - key: REMINDER_MORNING
        value: "08:00"

      - key: REMINDER_EVENING
        value: "20:00"

      - key: HTTP_TIMEOUT_SECONDS
        value: "15"

      - key: TELEGRAM_INIT_DATA_MAX_AGE
        value: "86400"
